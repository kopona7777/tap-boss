<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150a26">
<title>Boss Tapper</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{background:radial-gradient(1000px 620px at 50% -10%,#3a1c6e 0%,#150a26 55%,#0b0614 100%);transition:background .6s}
body.night{background:radial-gradient(1000px 640px at 50% -12%,#1b2a6b 0%,#0d1030 52%,#05060f 100%)}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12;transform:scale(.7)}50%{opacity:.85;transform:scale(1.25)}}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 0 0}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 2px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px}
.pill .ic{font-size:15px}
#modes{display:flex;gap:8px;padding:10px 14px 0}
.mode{flex:1;border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:12px;font-size:15px;font-weight:800;color:#fff;background:rgba(255,255,255,.06)}
.mode.on{background:linear-gradient(90deg,#f43f5e,#a855f7);border-color:transparent;box-shadow:0 8px 22px rgba(168,85,247,.35)}
.mode.night.on{background:linear-gradient(90deg,#4f46e5,#1e1b4b);box-shadow:0 8px 22px rgba(79,70,229,.4)}
#stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:8px}
.aura{position:absolute;top:50%;left:50%;width:min(86vw,370px);height:min(86vw,370px);margin:-min(43vw,185px) 0 0 -min(43vw,185px);border-radius:50%;background:radial-gradient(circle,rgba(244,63,94,.3),transparent 66%);animation:pulse 2.6s ease-in-out infinite;pointer-events:none}
body.night .aura{background:radial-gradient(circle,rgba(99,102,241,.34),transparent 66%)}
@keyframes pulse{0%,100%{transform:scale(.93);opacity:.6}50%{transform:scale(1.07);opacity:1}}
#boss{width:min(72vw,300px);height:min(72vw,300px);border-radius:32px;position:relative;display:flex;align-items:center;justify-content:center;
background:linear-gradient(160deg,#ff6b81,#c31162);box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.28);
overflow:hidden;transition:transform .09s ease}
#boss::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.3),transparent 62%)}
body.night #boss{background:linear-gradient(160deg,#4c1d95,#0f172a);box-shadow:0 24px 60px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.12)}
#boss.hit{animation:hit .2s ease-out}
@keyframes hit{0%{transform:scale(.88)}40%{transform:scale(1.07) rotate(-2.5deg)}100%{transform:scale(1) rotate(0)}}
#boss .face{font-size:86px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));animation:idle 2.8s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.05)}}
.badge{position:absolute;font-size:11px;font-weight:800;opacity:.92;background:rgba(0,0,0,.3);padding:4px 10px;border-radius:999px}
#blv{top:12px;left:12px}
#bnm{bottom:12px;right:12px}
.hpwrap{width:min(86vw,380px);height:20px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.12);position:relative;overflow:hidden}
.hpfill{height:100%;width:100%;background:linear-gradient(90deg,#34d399,#a3e635);box-shadow:0 0 14px rgba(163,230,53,.45);transition:width .2s ease,background .35s ease}
.hpwrap.low .hpfill{background:linear-gradient(90deg,#ef4444,#f97316);box-shadow:0 0 14px rgba(239,68,68,.55)}
.hpwrap::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 26px);pointer-events:none}
.hprow{display:flex;justify-content:space-between;align-items:center;width:min(86vw,380px);font-size:12px;font-weight:700;opacity:.88}
#mult{font-size:12px;font-weight:800;color:#c084fc}
#combo{position:absolute;top:4px;right:16px;font-size:22px;font-weight:900;color:#fde047;text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:0;transition:opacity .2s;pointer-events:none}
#combo.on{opacity:1}
.dmg{position:absolute;font-weight:900;font-size:24px;pointer-events:none;animation:up .95s cubic-bezier(.2,.8,.3,1) forwards;text-shadow:0 3px 10px rgba(0,0,0,.6);white-space:nowrap}
.dmg.crit{font-size:34px;color:#fde047;text-shadow:0 0 18px rgba(253,224,71,.75)}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}18%{opacity:1;transform:translate(-50%,-18px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-104px) scale(1)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:8}
#hint{font-size:12px;opacity:.45;text-align:center}
.panel{background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.1);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
#tabs{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.tab{flex:0 0 auto;white-space:nowrap;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700}
.tab.on{background:linear-gradient(90deg,#f43f5e,#a855f7)}
body.night .tab.on{background:linear-gradient(90deg,#6366f1,#312e81)}
.row{display:flex;gap:8px;overflow-x:auto;align-items:stretch;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.up{flex:0 0 auto;width:176px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;text-align:left;color:#fff;overflow:hidden}
.up b{display:block;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.up .c{display:block;color:#fbbf24;font-weight:800;font-size:12px;margin-top:3px}
.up span{display:block;font-size:11px;line-height:1.35;opacity:.72;margin-top:3px;overflow-wrap:anywhere}
.up:disabled{opacity:.38}
#win{position:absolute;inset:0;background:rgba(8,4,16,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;z-index:6}
#win.show{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
#win .medal{font-size:64px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
#win h2{margin:0;font-size:27px}
#win p{margin:0;opacity:.85;font-size:15px;white-space:pre-line;line-height:1.5}
.big{background:linear-gradient(90deg,#f43f5e,#a855f7);border:0;color:#fff;border-radius:15px;padding:15px 30px;font-size:16px;font-weight:800;box-shadow:0 10px 26px rgba(168,85,247,.35)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:16px;background:rgba(0,0,0,.8);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;z-index:9}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app">
  <header>
    <div class="pill"><span class="ic" id="icCoin"></span><span id="coins">0</span></div>
    <div class="pill"><span class="ic" id="icSword"></span><span id="dmg">1</span></div>
    <div class="pill"><span class="ic" id="icSkull"></span><span id="kills">0</span></div>
  </header>
  <div id="modes">
    <button class="mode on" id="mDay"></button>
    <button class="mode night" id="mNight"></button>
  </div>
  <div id="stage">
    <div class="aura"></div>
    <div id="combo"></div>
    <div id="boss">
      <div class="face" id="face"></div>
      <div class="badge" id="blv"></div>
      <div class="badge" id="bnm"></div>
    </div>
    <div class="hpwrap" id="hpwrap"><div class="hpfill" id="hp"></div></div>
    <div class="hprow"><span id="hptxt"></span><span id="mult"></span></div>
    <div id="hint"></div>
  </div>
  <div class="panel">
    <div id="tabs"></div>
    <div class="row" id="ups"></div>
  </div>
</div>
<div id="win">
  <div class="medal" id="medal"></div>
  <h2 id="wt"></h2>
  <p id="wp"></p>
  <button class="big" id="nextBtn"></button>
</div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<script src="game.js"></script>
<script src="game2.js"></script>
</body>
</html>
