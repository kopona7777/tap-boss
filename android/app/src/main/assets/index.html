<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a1e">
<title>Босс-тапалка</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#120a1e;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%;padding:env(safe-area-inset-top) 0 0}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;font-size:14px}
.pill{background:rgba(255,255,255,.09);border-radius:999px;padding:6px 12px;font-weight:700;display:flex;align-items:center;gap:6px}
#modes{display:flex;gap:8px;padding:8px 16px 0}
.mode{flex:1;border:0;border-radius:14px;padding:11px;font-size:15px;font-weight:800;color:#fff;background:rgba(255,255,255,.08)}
.mode.on{background:linear-gradient(90deg,#f43f5e,#a855f7)}
.mode.night.on{background:linear-gradient(90deg,#4c1d95,#1e3a8a)}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
#boss{width:min(78vw,320px);height:min(78vw,320px);border-radius:26px;position:relative;
 background:linear-gradient(160deg,#ff5f6d,#c31162);box-shadow:0 18px 40px rgba(0,0,0,.5);
 display:flex;align-items:center;justify-content:center;transition:transform .08s ease}
body.night #boss{background:linear-gradient(160deg,#4c1d95,#0f172a)}
#boss:active{transform:scale(.94)}
#boss .face{font-size:60px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
#boss .lv{position:absolute;top:10px;left:12px;font-size:12px;font-weight:800;opacity:.85}
#boss .nm{position:absolute;bottom:10px;right:12px;font-size:12px;font-weight:700;opacity:.85}
#hpwrap{position:absolute;left:6%;right:6%;bottom:-42px;height:16px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#a3e635);transition:width .18s ease}
body.night #hp{background:linear-gradient(90deg,#818cf8,#c084fc)}
#hptxt{position:absolute;left:0;right:0;bottom:-64px;text-align:center;font-size:13px;font-weight:700;opacity:.9}
#mult{position:absolute;left:0;right:0;bottom:-86px;text-align:center;font-size:12px;font-weight:800;color:#c084fc}
.dmg{position:absolute;font-weight:900;font-size:22px;pointer-events:none;animation:up .9s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.5)}
@keyframes up{0%{opacity:1;transform:translateY(0) scale(.8)}100%{opacity:0;transform:translateY(-90px) scale(1.3)}}
#hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;opacity:.5}
.panel{background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.1);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.up{flex:0 0 auto;min-width:145px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 11px;text-align:left;color:#fff}
.up b{display:block;font-size:13px}
.up span{font-size:11px;opacity:.72}
.up .c{color:#fbbf24;font-weight:800}
.up:disabled{opacity:.4}
#tabs{display:flex;gap:6px;margin-bottom:9px;overflow-x:auto}
.tab{flex:0 0 auto;background:rgba(255,255,255,.08);border:0;color:#fff;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700}
.tab.on{background:linear-gradient(90deg,#f43f5e,#a855f7)}
body.night .tab.on{background:linear-gradient(90deg,#7c3aed,#1d4ed8)}
#win{position:absolute;inset:0;background:rgba(10,5,20,.93);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;text-align:center;z-index:5}
#win h2{margin:0;font-size:26px}
#win p{margin:0;opacity:.85;font-size:15px;white-space:pre-line}
.big{background:linear-gradient(90deg,#f43f5e,#a855f7);border:0;color:#fff;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:800}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:14px;background:rgba(0,0,0,.75);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s;z-index:9}
#pop{position:fixed;inset:0;pointer-events:none;z-index:8}
</style></head><body>
<div id="app">
  <header>
    <div class="pill">&#129689; <span id="coins">0</span></div>
    <div class="pill">&#9876; <span id="dmg">1</span> &#10987;&#1086;&#1085;</div>
    <div class="pill">&#128128; <span id="kills">0</span></div>
  </header>
  <div id="modes">
    <button class="mode on" id="mDay">&#9728; &#1040;&#1077;&#1085;&#1100;</button>
    <button class="mode night" id="mNight">&#127769; &#1053;&#1086;&#1095;&#1100;</button>
  </div>
  <div id="stage">
    <div id="boss">
      <div class="lv" id="blv">&#1059;&#1088;. 1</div>
      <div class="face" id="face">&#128121;</div>
      <div class="nm" id="bnm">&#1057;&#1083;&#1080;&#1079;&#1077;&#1085;&#1100;</div>
      <div id="hpwrap"><div id="hp"></div></div>
      <div id="hptxt">100 / 100</div>
      <div id="mult" style="display:none"></div>
    </div>
    <div id="hint">&#1090;&#1072;&#1087;&#1072;&#1081; &#1087;&#1086; &#1073;&#1086;&#1089;&#1089;&#1091;</div>
  </div>
  <div class="panel">
    <div id="tabs"></div>
    <div class="row" id="ups"></div>
  </div>
</div>
<div id="win">
  <div style="font-size:56px">&#127942;</div>
  <h2 id="wt">&#1041;&#1086;&#1089;&#1089; &#1087;&#1086;&#1073;&#1077;&#1078;&#1076;&#1105;&#1085;!</h2>
  <p id="wp"></p>
  <button class="big" onclick="nextBoss()">&#1044;&#1072;&#1083;&#1100;&#1096;&#1077;</button>
</div>
<div id="pop"></div>
<div id="toast"></div>
<script>
const BOSSES=[
 {n:"&#1057;&#1083;&#1080;&#1079;&#1077;&#1085;&#1100;",f:"&#128121;",hp:100,coin:15},
 {n:"&#1043;&#1086;&#1073;&#1083;&#1080;&#1085;",f:"&#128578;",hp:420,coin:60},
 {n:"&#1057;&#1082;&#1077;&#1083;&#1077;&#1090;",f:"&#128128;",hp:1600,coin:220},
 {n:"&#1044;&#1088;&#1072;&#1082;&#1086;&#1085;",f:"&#128009;",hp:6500,coin:900},
 {n:"&#1058;&#1080;&#1090;&#1072;&#1085;",f:"&#128081;",hp:26000,coin:3800}
];
const NIGHT=[
 {n:"&#1058;&#1077;&#1085;&#1100;",f:"&#128100;",hp:60},
 {n:"&#1050;&#1088;&#1099;&#1089;&#1083;&#1086;&#1074;",f:"&#128000;",hp:80},
 {n:"&#1055;&#1077;&#1087;&#1077;&#1083;&#1100;&#1085;&#1099;&#1081; &#1057;&#1090;&#1088;&#1072;&#1078;",f:"&#128511;",hp:110},
 {n:"&#1057;&#1082;&#1086;&#1088;&#1087;&#1080;&#1086;&#1085;",f:"&#129418;",hp:150},
 {n:"&#1041;&#1086;&#1083;&#1086;&#1090;&#1085;&#1072;&#1103; &#1058;&#1074;&#1072;&#1088;&#1100;",f:"&#128026;",hp:200},
 {n:"&#1042;&#1080;&#1074;&#1077;&#1088;&#1085;&#1072;",f:"&#128024;",hp:260},
 {n:"&#1050;&#1086;&#1089;&#1090;&#1103;&#1085;&#1086;&#1081; &#1051;&#1086;&#1088;&#1076;",f:"&#129460;",hp:330},
 {n:"&#1055;&#1077;&#1087;&#1077;&#1083;&#1100;&#1085;&#1099;&#1081; &#1044;&#1088;&#1072;&#1082;&#1086;&#1085;",f:"&#128009;&#8205;&#128293;",hp:410},
 {n:"&#1044;&#1077;&#1084;&#1086;&#1085; &#1055;&#1091;&#1089;&#1090;&#1086;&#1090;&#1099;",f:"&#128719;",hp:500},
 {n:"&#1051;&#1091;&#1085;&#1085;&#1099;&#1081; &#1057;&#1082;&#1080;&#1083;&#1083;&#1077;&#1090;",f:"&#128160;",hp:600},
 {n:"&#1055;&#1086;&#1078;&#1080;&#1088;&#1072;&#1090;&#1077;&#1083;&#1100;",f:"&#129408;",hp:700},
 {n:"&#1050;&#1088;&#1086;&#1074;&#1072;&#1074;&#1099;&#1081; &#1050;&#1083;&#1080;&#1085;&#1086;&#1082;",f:"&#9876;",hp:820},
 {n:"&#1060;&#1086;&#1079;&#1103; &#1041;&#1079;&#1077;&#1076;&#1085;&#1099;",f:"&#127754;",hp:950},
 {n:"&#1055;&#1086;&#1078;&#1080;&#1088;&#1072;&#1090;&#1077;&#1083;&#1100; &#1052;&#1080;&#1088;&#1086;&#1074;",f:"&#129395;",hp:1100},
 {n:"&#1053;&#1086;&#1095;&#1085;&#1086;&#1081; &#1040;&#1088;&#1093;&#1086;&#1085;&#1090;",f:"&#127761;",hp:1300}
];
const UPG=[
 {k:"dmg",t:"&#1059;&#1088;&#1086;&#1085; +1",c:20,g:1.5},
 {k:"dmg2",t:"&#1059;&#1088;&#1086;&#1085; x2",c:900,g:2.2},
 {k:"crit",t:"&#1068;&#1072;&#1085;&#1089; &#1082;&#1088;&#1080;&#1090;&#1072; 10%",c:300,g:1.6},
 {k:"coin",t:"&#1052;&#1086;&#1085;&#1077;&#1090; +25%",c:150,g:1.5}
];
const NUPG={k:"nm",t:"&#1053;&#1086;&#1095;&#1085;&#1072;&#1103; &#1084;&#1086;&#1099;&#1085;&#1086;&#1089;&#1090;&#1100; x3",c:300,g:3};
const NMUL=3;
let S={coins:0,dmg:1,crit:0,coinb:0,kills:0,boss:0,hp:0,maxhp:0,up:{},nm:1,nup:0,night:0};
let mode="day";
function $(s){return document.querySelector(s);}
function load(){try{const r=localStorage.getItem("tapboss");if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem("tapboss",JSON.stringify(S));}catch(e){}}
function fmt(n){n=Math.floor(n);if(!isFinite(n))return "0";
 if(n<1e6)return n.toLocaleString("ru-RU");
 if(n<1e9)return (n/1e6).toFixed(1).replace(".",",")+"M";
 if(n<1e12)return (n/1e9).toFixed(1).replace(".",",")+"B";
 if(n<1e15)return (n/1e12).toFixed(1).replace(".",",")+"T";
 return n.toExponential(1).replace(".",",");}
function dayBoss(){return BOSSES[Math.min(S.boss,BOSSES.length-1)];}
function nightBoss(){return NIGHT[Math.min(S.night,NIGHT.length-1)];}
function nightHP(i){return NIGHT[i].hp*Math.pow(NMUL,i);}
function nightReward(i){return 800*Math.pow(NMUL,i);}
function nightDmg(){return S.dmg*S.nm;}
function startBoss(){
  if(mode==="day"){
    const b=dayBoss(); S.maxhp=b.hp; S.hp=b.hp;
    $("#face").textContent=b.f; $("#bnm").textContent=b.n;
    $("#blv").textContent="&#1059;&#1088;. "+(S.boss+1);
    $("#mult").style.display="none";
  }else{
    const i=Math.min(S.night,NIGHT.length-1); const b=NIGHT[i];
    S.maxhp=nightHP(i); S.hp=S.maxhp;
    $("#face").textContent=b.f; $("#bnm").textContent=b.n;
    $("#blv").textContent="&#1053;&#1086;&#1095;&#1100; "+(i+1)+"/"+NIGHT.length;
    const m=$("#mult"); m.style.display="block";
    m.innerHTML="HP x"+Math.pow(NMUL,i)+" &mdash; x"+NMUL+" &#1079;&#1072; &#1082;&#1072;&#1078;&#1076;&#1086;&#1075;&#1086; &#1087;&#1088;&#1086;&#1081;&#1076;&#1077;&#1085;&#1085;&#1086;&#1075;&#1086;";
  }
  draw();
}
function draw(){
  document.getElementById("hp").style.width=Math.max(0,100*S.hp/S.maxhp)+"%";
  document.getElementById("hptxt").textContent=fmt(S.hp)+" / "+fmt(S.maxhp);
  document.getElementById("coins").textContent=fmt(S.coins);
  document.getElementById("dmg").textContent=fmt(mode==="day"?S.dmg:nightDmg());
  document.getElementById("kills").textContent=S.kills;
}
let _tt=null;
function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;
 clearTimeout(_tt);_tt=setTimeout(()=>e.style.opacity=0,1300);}
let ac=null;
function beep(f,du){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
 const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;g.gain.value=.05;
 o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+du);}catch(e){}}
function tap(e){
  if(S.hp<=0)return;
  const crit=Math.random()<S.crit;
  const base=mode==="day"?S.dmg:nightDmg();
  const dd=Math.ceil(base*(crit?3:1));
  S.hp=Math.max(0,S.hp-dd);
  const b=$("#boss"), r=b.getBoundingClientRect();
  const x=(e&&e.clientX)||(r.left+r.width/2), y=(e&&e.clientY)||(r.top+r.height/2);
  const el=document.createElement("div");
  el.className="dmg"; el.textContent=(crit?"&#10022;":"")+fmt(dd);
  el.style.left=(x-20)+"px"; el.style.top=(y-40)+"px";
  el.style.color=crit?"#fde047":"#fff";
  $("#pop").appendChild(el); setTimeout(()=>el.remove(),900);
  beep(crit?880:520,0.06);
  draw();
  if(S.hp<=0)win();
}
function win(){
  if(mode==="day"){
    const b=dayBoss(); const reward=Math.ceil(b.coin*(1+S.coinb));
    S.coins+=reward; S.kills++;
    const wasLast=S.boss>=BOSSES.length-1;
    S.boss=Math.min(S.boss+1,BOSSES.length-1);
    save();
    $("#wt").textContent=b.n+" &#1087;&#1086;&#1073;&#1077;&#1078;&#1076;&#1105;&#1085;!";
    $("#wp").textContent="&#1053;&#1072;&#1075;&#1088;&#1072;&#1076;&#1072;: "+fmt(reward)+" &#129689;"+(wasLast?"\n&#127769; &#1054;&#1090;&#1082;&#1088;&#1099;&#1090;&#1072; &#1085;&#1086;&#1095;&#1100;!":"");
  }else{
    const i=Math.min(S.night,NIGHT.length-1); const b=NIGHT[i];
    const reward=Math.ceil(nightReward(i)*(1+S.coinb));
    S.coins+=reward; S.kills++;
    const wasLast=i>=NIGHT.length-1;
    S.night=Math.min(S.night+1,NIGHT.length-1);
    save();
    $("#wt").textContent=b.n+" &#1087;&#1086;&#1073;&#1077;&#1078;&#1076;&#1105;&#1085;!";
    $("#wp").textContent="&#1053;&#1072;&#1075;&#1088;&#1072;&#1076;&#1072;: "+fmt(reward)+" &#129689;"+
      (wasLast?"\n&#127761; &#1042;&#1089;&#1103; &#1085;&#1086;&#1095;&#1100; &#1087;&#1088;&#1086;&#1081;&#1076;&#1077;&#1085;&#1072!":"\n&#1057;&#1083;&#1077;&#1076;&#1091;&#1102;&#1096;&#1080;&#1081; &#1073;&#1086;&#1089;&#1089;: HP x"+Math.pow(NMUL,S.night));
  }
  $("#win").style.display="flex";
}
function nextBoss(){$("#win").style.display="none";startBoss();save();renderTabs();renderUps();}
function buy(i){
  const u=UPG[i], lv=S.up[i]||0;
  const cost=Math.floor(u.c*Math.pow(u.g,lv));
  if(S.coins<cost)return toast("&#1053;&#1077; &#1093;&#1074;&#1072;&#1090;&#1072;&#1077;&#1090; &#1084;&#1086;&#1085;&#1077;&#1090");
  S.coins-=cost; S.up[i]=lv+1;
  if(u.k==="dmg")S.dmg=S.dmg+1;
  if(u.k==="dmg2")S.dmg=S.dmg*2;
  if(u.k==="crit")S.crit=Math.min(.5,S.crit+.1);
  if(u.k==="coin")S.coinb+=.25;
  save(); renderUps(); draw(); toast("&#1050;&#1091;&#1087;&#1083;&#1077;&#1085;&#1086!");
}
function buyNight(){
  const lv=S.nup||0;
  const cost=Math.floor(NUPG.c*Math.pow(NUPG.g,lv));
  if(S.coins<cost)return toast("&#1053;&#1077; &#1093;&#1074;&#1072;&#1090;&#1072;&#1077;&#1090; &#1084;&#1086;&#1085;&#1077;&#1090");
  S.coins-=cost; S.nup=lv+1; S.nm=S.nm*3;
  save(); renderUps(); draw(); toast("&#1053;&#1086;&#1095;&#1085;&#1072;&#1103; &#1084;&#1086;&#1097;&#1086;&#1089;&#1090;&#1100; x"+S.nm);
}
function renderUps(){
  const box=$("#ups"); box.innerHTML="";
  if(mode==="night"){
    const lv=S.nup||0, cost=Math.floor(NUPG.c*Math.pow(NUPG.g,lv));
    const b=document.createElement("button");
    b.className="up"; b.disabled=S.coins<cost;
    b.innerHTML="<b>"+NUPG.t+" <span class='c'>"+fmt(cost)+" &#129689;</span></b><span>&#1091;&#1088;. "+lv+" &middot; &#1089;&#1080;&#1083;&#1072; &#1091;&#1089;&#1080;&#1083;&#1077;&#1085;&#1080;&#1103; x"+S.nm+"</span>";
    b.onclick=buyNight; box.appendChild(b);
    const back=document.createElement("button");
    back.className="up"; back.innerHTML="<b>&#8617; &#1053;&#1072;&#1079;&#1072;&#1076;</b><span>&#1082; &#1086;&#1073;&#1091;&#1095;&#1077;&#1085;&#1080;&#1103;</span>";
    back.onclick=()=>{mode="day";setMode();startBoss();renderTabs();renderUps();save();};
    box.appendChild(back);
    return;
  }
  UPG.forEach((u,i)=>{
    const lv=S.up[i]||0, cost=Math.floor(u.c*Math.pow(u.g,lv));
    const b=document.createElement("button");
    b.className="up"; b.disabled=S.coins<cost;
    b.innerHTML="<b>"+u.t+" <span class='c'>"+fmt(cost)+" &#129689;</span></b><span>&#1091;&#1088;. "+lv+"</span>";
    b.onclick=()=>buy(i); box.appendChild(b);
  });
}
function renderTabs(){
  const t=$("#tabs"); t.innerHTML="";
  if(mode==="night"){
    NIGHT.forEach((b,i)=>{
      if(i>S.night)return;
      const el=document.createElement("button");
      el.className="tab"+(i===S.night?" on":"");
      el.textContent=(i+1)+". "+b.f+" "+b.n;
      el.onclick=()=>{S.night=i;startBoss();save();renderTabs();};
      t.appendChild(el);
    });
    return;
  }
  BOSSES.forEach((b,i)=>{
    if(i>S.boss)return;
    const el=document.createElement("button");
    el.className="tab"+(i===S.boss?" on":"");
    el.textContent=b.f+" "+b.n;
    el.onclick=()=>{S.boss=i;startBoss();save();renderTabs();};
    t.appendChild(el);
  });
}
function setMode(){
  document.body.classList.toggle("night",mode==="night");
  $("#mDay").classList.toggle("on",mode==="day");
  $("#mNight").classList.toggle("on",mode==="night");
}
$("#mDay").onclick=()=>{mode="day";setMode();startBoss();renderTabs();renderUps();save();};
$("#mNight").onclick=()=>{mode="night";setMode();startBoss();renderTabs();renderUps();save();};
document.getElementById("stage").addEventListener("pointerdown",e=>{e.preventDefault();tap(e);});
document.addEventListener("contextmenu",e=>e.preventDefault());
load(); setMode(); startBoss(); renderTabs(); renderUps();
setInterval(()=>{renderUps();draw();},600);
</script>
</body></html>
