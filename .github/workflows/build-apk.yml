name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate keystore
        working-directory: android
        run: |
          mkdir -p app/keystore
          keytool -genkeypair -v -keystore app/keystore/release.jks \
            -alias tapboss -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tapboss123 -keypass tapboss123 \
            -dname "CN=TapBoss, OU=Game, O=TapBoss, L=Moscow, ST=Moscow, C=RU"
          ls -la app/keystore/

      - name: Build release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tap-boss-apk
          path: android/app/build/outputs/apk/release/*.apk
